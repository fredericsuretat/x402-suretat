name: x402-markdown

services:
  markdown:
    build: .
    container_name: x402-markdown
    restart: unless-stopped
    ports:
      - "3049:3049"
    env_file:
      - .env
    networks:
      - traefik
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-markdown.rule=Host(`x402-markdown.suretat.com`)"
      - "traefik.http.routers.x402-markdown.entrypoints=websecure"
      - "traefik.http.routers.x402-markdown.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-markdown.loadbalancer.server.port=3049"

networks:
  traefik:
    external: true
    name: traefik
  proxy:
    external: true
    name: proxy
