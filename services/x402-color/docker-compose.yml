services:
  x402-color:
    build: .
    image: x402-color:latest
    container_name: x402-color
    restart: unless-stopped
    ports:
      - "3068:3068"
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-color.rule=Host(`x402-color.suretat.com`)"
      - "traefik.http.routers.x402-color.entrypoints=websecure"
      - "traefik.http.routers.x402-color.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-color.loadbalancer.server.port=3068"
    networks:
      - traefik-net
networks:
  traefik-net:
    external: true
