name: x402-csv2json

services:
  csv2json:
    build: .
    container_name: x402-csv2json
    restart: unless-stopped
    ports:
      - "3073:3073"
    env_file:
      - .env
    networks:
      - traefik
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-csv2json.rule=Host(`x402-csv2json.suretat.com`)"
      - "traefik.http.routers.x402-csv2json.entrypoints=websecure"
      - "traefik.http.routers.x402-csv2json.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-csv2json.loadbalancer.server.port=3073"

networks:
  traefik:
    external: true
    name: traefik
  proxy:
    external: true
    name: proxy
