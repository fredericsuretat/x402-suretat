services:
  x402-feries:
    build: .
    image: x402-feries:latest
    container_name: x402-feries
    restart: unless-stopped
    ports:
      - "3063:3063"
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-feries.rule=Host(`x402-feries.suretat.com`)"
      - "traefik.http.routers.x402-feries.entrypoints=websecure"
      - "traefik.http.routers.x402-feries.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-feries.loadbalancer.server.port=3063"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
