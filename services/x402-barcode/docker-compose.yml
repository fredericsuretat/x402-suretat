name: x402-barcode

services:
  barcode:
    build: .
    container_name: x402-barcode
    restart: unless-stopped
    ports:
      - "3050:3050"
    env_file:
      - .env
    networks:
      - traefik
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-barcode.rule=Host(`x402-barcode.suretat.com`)"
      - "traefik.http.routers.x402-barcode.entrypoints=websecure"
      - "traefik.http.routers.x402-barcode.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-barcode.loadbalancer.server.port=3050"

networks:
  traefik:
    external: true
    name: traefik
  proxy:
    external: true
    name: proxy
