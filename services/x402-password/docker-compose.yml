name: x402-password

services:
  password:
    build: .
    container_name: x402-password
    restart: unless-stopped
    ports:
      - "3052:3052"
    env_file:
      - .env
    networks:
      - traefik
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-password.rule=Host(`x402-password.suretat.com`)"
      - "traefik.http.routers.x402-password.entrypoints=websecure"
      - "traefik.http.routers.x402-password.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-password.loadbalancer.server.port=3052"

networks:
  traefik:
    external: true
    name: traefik
  proxy:
    external: true
    name: proxy
