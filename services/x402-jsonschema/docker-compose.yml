name: x402-jsonschema

services:
  jsonschema:
    build: .
    container_name: x402-jsonschema
    restart: unless-stopped
    ports:
      - "3054:3054"
    env_file:
      - .env
    networks:
      - traefik
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.x402-jsonschema.rule=Host(`x402-jsonschema.suretat.com`)"
      - "traefik.http.routers.x402-jsonschema.entrypoints=websecure"
      - "traefik.http.routers.x402-jsonschema.tls.certresolver=letsencrypt"
      - "traefik.http.services.x402-jsonschema.loadbalancer.server.port=3054"

networks:
  traefik:
    external: true
    name: traefik
  proxy:
    external: true
    name: proxy
